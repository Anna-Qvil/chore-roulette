<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* --- Base Layout & iOS Optimizations --- */
      body {
        height: 100dvh;
        overflow: hidden; 
      }

      #task-manager {
        background: white;
        border-radius: 24px;
        border: 6px solid #ffd700;
        width: 95%;
        max-width: 800px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        max-height: 90dvh;
        padding: 15px;
        box-sizing: border-box;
      }

      h2 {
        font-size: 1.5rem;
        margin-bottom: 15px;
        flex-shrink: 0;
      }

      #task-list {
        flex-grow: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-right: 5px;
        padding-bottom: 20px;
      }

      /* --- MOBILE CARD LAYOUT --- */
      .task-row {
        display: grid;
        /* Columns: Emoji | Name (flex) | Delete Button */
        grid-template-columns: 50px 1fr 44px; 
        grid-template-areas: 
            "emoji name name"
            "time  dep  delete";
        gap: 10px;
        
        background-color: #fdfdfd;
        border: 1px solid #f0f0f0;
        padding: 12px;
        border-radius: 16px; 
        margin-bottom: 12px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      }

      .inp-emoji { grid-area: emoji; }
      .inp-name  { grid-area: name; }
      .inp-time  { grid-area: time; }
      .sel-dep   { grid-area: dep; }
      .btn-delete{ grid-area: delete; }

      /* Input Base Styles */
      input, select {
        -webkit-appearance: none;
        appearance: none;
        background-color: #fff9e6;
        border: 2px solid transparent;
        border-radius: 12px;
        font-family: inherit;
        font-size: 16px; 
        color: #333;
        padding: 0 12px;
        height: 44px; 
        width: 100%;
        box-sizing: border-box;
        transition: all 0.2s;
      }

      input:focus, select:focus {
        border-color: #ffd700;
        background-color: #fff;
        outline: none;
      }

      /* --- DEPENDENCY DROPDOWN STYLING --- */
      .sel-dep {
        /* Add a custom SVG arrow so it looks like a dropdown */
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FF4500' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 16px;
        padding-right: 30px; /* Make room for the arrow */
        
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
      }

      .inp-emoji { text-align: center; padding: 0; }
      .inp-name { font-weight: 500; }
      .inp-time { text-align: center; padding: 0 5px; }

      /* --- DELETE BUTTON STYLING --- */
      .btn-delete {
        width: 44px;
        height: 44px;
        background-color: transparent; /* No shading */
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #FF4500; /* Red icon color */
        cursor: pointer;
        padding: 0;
        box-shadow: none;
      }
      
      /* Subtle press effect */
      .btn-delete:active {
        opacity: 0.6;
        transform: scale(0.9);
        box-shadow: none;
      }

      .btn-delete svg {
        width: 24px;
        height: 24px;
        stroke-width: 2;
      }

      /* Footer */
      .footer-actions {
        flex-shrink: 0;
        text-align: center;
        padding-top: 10px;
        border-top: 1px solid #eee;
      }

      button#add-task-btn {
        width: 100%;
        max-width: 320px;
        padding: 14px;
        font-size: 18px;
        border-radius: 16px;
        margin-top: 5px;
        background-color: #FF6B6B;
        color: white;
        font-weight: bold;
        border: none;
        box-shadow: none;
      }
      
      button#add-task-btn:active {
        transform: translateY(2px);
        box-shadow: none;
      }

      /* --- TABLET / DESKTOP OVERRIDES --- */
      @media (min-width: 768px) {
        #task-manager { padding: 30px; }
        
        .task-row {
            display: flex; /* Single row */
            background-color: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
            margin-bottom: 15px;
            gap: 12px;
        }

        .inp-emoji { width: 50px; flex-shrink: 0; }
        .inp-name  { flex-grow: 2; width: auto; }
        .inp-time  { width: 80px; flex-shrink: 0; }
        .sel-dep   { width: 200px; flex-shrink: 0; }
        .btn-delete{ width: 44px; flex-shrink: 0; }
      }
    </style>
  </head>
  <body>
    <div id="task-manager">
      <h2 style="text-align: center; color: #ff4500; margin-top: 0">
        Task list
      </h2>
      
      <div id="task-list"></div>

      <div class="footer-actions">
        <button id="add-task-btn">Add Task</button>
      </div>
    </div>

    <script>
      const taskListContainer = document.getElementById("task-list");
      const addTaskBtn = document.getElementById("add-task-btn");

      let tasks = JSON.parse(localStorage.getItem("chore-tasks")) || [
        { id: Date.now(), emoji: "", name: "", time: "", dependency: "" },
      ];

      function saveTasks() {
        localStorage.setItem("chore-tasks", JSON.stringify(tasks));
      }

      function getDependencyOptions(currentTaskId, selectedId) {
        let html = '<option value="">No dependency</option>';
        tasks.forEach((t) => {
          if (t.id !== currentTaskId && t.name.trim() !== "") {
            const isSelected = String(t.id) === String(selectedId) ? "selected" : "";
            let label = t.name;
            if (label.length > 20) label = label.substring(0, 18) + "...";
            html += `<option value="${t.id}" ${isSelected}>After: ${label}</option>`;
          }
        });
        return html;
      }

      function updateAllDropdowns() {
        const selects = document.querySelectorAll(".sel-dep");
        tasks.forEach((task, index) => {
          const select = selects[index];
          if (select) {
            const currentVal = task.dependency;
            select.innerHTML = getDependencyOptions(task.id, currentVal);
          }
        });
      }

      function renderTasks() {
        taskListContainer.innerHTML = "";
        tasks.forEach((task, index) => {
          const row = document.createElement("div");
          row.className = "task-row";

          const deleteIconSvg = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
          `;

          row.innerHTML = `
                    <input type="text" class="inp-emoji" placeholder="Icon" value="${task.emoji}">
                    <input type="text" class="inp-name" placeholder="Task name" value="${task.name}">
                    <input type="number" class="inp-time" placeholder="Min" value="${task.time}" min="0">
                    <select class="sel-dep">
                        ${getDependencyOptions(task.id, task.dependency)}
                    </select>
                    <button class="btn-delete" aria-label="Delete task">${deleteIconSvg}</button>
                `;

          const inputs = row.querySelectorAll("input");
          inputs[0].oninput = (e) => { tasks[index].emoji = e.target.value; saveTasks(); };
          inputs[1].oninput = (e) => { tasks[index].name = e.target.value; updateAllDropdowns(); saveTasks(); };
          inputs[2].oninput = (e) => { tasks[index].time = e.target.value; saveTasks(); };

          const select = row.querySelector("select");
          select.onchange = (e) => { tasks[index].dependency = e.target.value; saveTasks(); };

          const deleteBtn = row.querySelector(".btn-delete");
          deleteBtn.onclick = () => {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
          };

          taskListContainer.appendChild(row);
        });

        addTaskBtn.style.display = tasks.length >= 10 ? "none" : "inline-block";
      }

      addTaskBtn.addEventListener("click", () => {
        if (tasks.length >= 10) return;

        if (tasks.length > 0) {
          const lastTask = tasks[tasks.length - 1];
          if (!lastTask.name.trim() || !lastTask.time || lastTask.time <= 0) {
            alert("Please fill in the task name and time.");
            return;
          }
        }

        tasks.push({ id: Date.now(), emoji: "", name: "", time: "", dependency: "" });
        saveTasks();
        renderTasks();
        
        setTimeout(() => {
            taskListContainer.scrollTo({ top: taskListContainer.scrollHeight, behavior: 'smooth' });
        }, 100);
      });

      renderTasks();
    </script>
  </body>
</html>
