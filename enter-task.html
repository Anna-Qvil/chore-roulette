<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* --- iOS Specific Optimization Overrides --- */
      
      body {
        /* Ensure the body takes full height but doesn't bounce */
        height: 100dvh;
        overflow: hidden; /* We will scroll inside the container */
      }

      /* Main Card Container */
      #task-manager {
        background: white;
        border-radius: 24px; /* Softer, more iOS-like corners */
        border: 6px solid #ffd700;
        width: 95%; /* Wider on mobile */
        max-width: 650px; /* Cap width for iPad */
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        
        /* Layout for internal scrolling */
        display: flex;
        flex-direction: column;
        max-height: 90dvh; /* Don't touch edges */
        padding: 20px 15px; /* Reduced side padding for mobile space */
        box-sizing: border-box;
      }

      h2 {
        font-size: 1.5rem;
        margin-bottom: 15px;
        flex-shrink: 0; /* Header doesn't shrink */
      }

      /* Scrollable Area */
      #task-list {
        flex-grow: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch; /* Smooth momentum scrolling on iOS */
        padding-right: 5px; /* Space for scrollbar */
        padding-bottom: 10px;
        margin-bottom: 10px;
      }

      /* Task Row Layout */
      .task-row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
        align-items: center;
      }

      /* Input Styling for iOS */
      input,
      select {
        -webkit-appearance: none;
        appearance: none;
        background-color: #fff9e6;
        border: 2px solid transparent;
        border-radius: 12px;
        font-family: inherit;
        /* Critical: 16px prevents iOS auto-zoom on focus */
        font-size: 16px; 
        color: #333;
        padding: 0 10px;
        height: 44px; /* Minimum Apple touch target size */
        transition: border-color 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
      }

      input:focus, select:focus {
        border-color: #ffd700;
        outline: none;
        background-color: #fff;
        box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.2);
      }

      /* Specific Field Sizing */
      .inp-emoji {
        width: 44px; /* Square touch target */
        text-align: center;
        padding: 0;
        flex-shrink: 0;
      }
      
      .inp-name {
        flex-grow: 2;
        min-width: 80px; /* Prevent crushing on small screens */
      }
      
      .inp-time {
        width: 60px;
        text-align: center;
        flex-shrink: 0;
      }
      
      .sel-dep {
        flex-grow: 1;
        width: 100px; /* Allow shrinking/growing */
        text-overflow: ellipsis;
      }

      /* Delete Button */
      .btn-delete {
        width: 44px;
        height: 44px;
        background-color: #FFF0F0;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: #FF4500;
        transition: background-color 0.2s;
        padding: 0; /* Reset padding */
      }

      .btn-delete:active {
        background-color: #FFD1D1;
        transform: scale(0.95);
      }
      
      .btn-delete svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
      }

      /* Add Task Button Footer */
      .footer-actions {
        flex-shrink: 0;
        text-align: center;
        padding-top: 10px;
        border-top: 1px solid #eee;
      }

      button#add-task-btn {
        width: 100%;
        max-width: 300px;
        padding: 14px;
        font-size: 18px;
        border-radius: 16px;
        margin-top: 5px;
        background-color: #FF6B6B; /* Match styles.css but ensure it overrides */
        box-shadow: 0 4px #CC5555;
      }
      
      button#add-task-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px #CC5555;
      }

      /* iPad Optimization */
      @media (min-width: 768px) {
        #task-manager {
            padding: 30px;
        }
        .task-row {
            gap: 15px;
        }
      }
    </style>
  </head>
  <body>
    <div id="task-manager">
      <h2 style="text-align: center; color: #ff4500; margin-top: 0">
        Task list
      </h2>
      
      <div id="task-list"></div>

      <div class="footer-actions">
        <button id="add-task-btn">Add task</button>
      </div>
    </div>

    <script>
      const taskListContainer = document.getElementById("task-list");
      const addTaskBtn = document.getElementById("add-task-btn");

      // Load tasks from localStorage or initialize with empty task
      let tasks = JSON.parse(localStorage.getItem("chore-tasks")) || [
        { id: Date.now(), emoji: "", name: "", time: "", dependency: "" },
      ];

      function saveTasks() {
        localStorage.setItem("chore-tasks", JSON.stringify(tasks));
      }

      function getDependencyOptions(currentTaskId, selectedId) {
        let html = '<option value="">No dependency</option>';
        tasks.forEach((t) => {
          if (t.id !== currentTaskId && t.name.trim() !== "") {
            const isSelected =
              String(t.id) === String(selectedId) ? "selected" : "";
            html += `<option value="${t.id}" ${isSelected}>After: ${t.name}</option>`;
          }
        });
        return html;
      }

      function updateAllDropdowns() {
        const selects = document.querySelectorAll(".sel-dep");
        tasks.forEach((task, index) => {
          const select = selects[index];
          if (select) {
            // Save current selection before updating HTML
            const currentVal = task.dependency;
            select.innerHTML = getDependencyOptions(task.id, currentVal);
          }
        });
      }

      function renderTasks() {
        taskListContainer.innerHTML = "";
        tasks.forEach((task, index) => {
          const row = document.createElement("div");
          row.className = "task-row";

          // Using an inline SVG for the delete icon so no external image is needed
          const deleteIconSvg = `
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          `;

          row.innerHTML = `
                    <input type="text" class="inp-emoji" placeholder="Icon" value="${task.emoji}">
                    <input type="text" class="inp-name" placeholder="Task name" value="${task.name}">
                    <input type="number" class="inp-time" placeholder="Min" value="${task.time}" min="0">
                    <select class="sel-dep">
                        ${getDependencyOptions(task.id, task.dependency)}
                    </select>
                    <button class="btn-delete" data-index="${index}">${deleteIconSvg}</button>
                `;

          // Event Listeners
          const inputs = row.querySelectorAll("input");
          inputs[0].oninput = (e) => {
            tasks[index].emoji = e.target.value;
            saveTasks();
          };
          inputs[1].oninput = (e) => {
            tasks[index].name = e.target.value;
            updateAllDropdowns();
            saveTasks();
          };
          inputs[2].oninput = (e) => {
            tasks[index].time = e.target.value;
            saveTasks();
          };

          const select = row.querySelector("select");
          select.onchange = (e) => {
            tasks[index].dependency = e.target.value;
            saveTasks();
          };

          const deleteBtn = row.querySelector(".btn-delete");
          deleteBtn.onclick = () => {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
          };

          taskListContainer.appendChild(row);
        });

        addTaskBtn.style.display = tasks.length >= 10 ? "none" : "inline-block";
        
        // Auto-scroll to bottom only if a new task was likely added (optional polish)
        // taskListContainer.scrollTop = taskListContainer.scrollHeight;
      }

      addTaskBtn.addEventListener("click", () => {
        if (tasks.length >= 10) return;

        // Validation
        if (tasks.length > 0) {
          const lastTask = tasks[tasks.length - 1];
          if (!lastTask.name.trim() || !lastTask.time || lastTask.time <= 0) {
            alert("Please fill in the task name and time (in minutes) before adding a new task.");
            return;
          }
        }

        tasks.push({
          id: Date.now(),
          emoji: "",
          name: "",
          time: "",
          dependency: "",
        });
        saveTasks();
        renderTasks();
        
        // Smooth scroll to the new task
        setTimeout(() => {
            taskListContainer.scrollTo({
                top: taskListContainer.scrollHeight,
                behavior: 'smooth'
            });
        }, 100);
      });

      // Initial render
      renderTasks();
    </script>
  </body>
</html>
