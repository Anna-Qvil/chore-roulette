<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App</title>

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        body { font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        textarea { width: 80%; height: 100px; margin-top: 20px; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Hello World!</h1>
    <p>This is my iPad App.</p>

    <textarea id="noteBox" placeholder="Type something here to save..."></textarea>

    <script>
        // Register the Service Worker (required for PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log("Service Worker Registered"));
        }

        // Simple LocalStorage Logic
        const noteBox = document.getElementById('noteBox');
        
        // Load saved text on startup
        noteBox.value = localStorage.getItem('myNote') || "";

        // Save text automatically as she types
        noteBox.addEventListener('input', () => {
            localStorage.setItem('myNote', noteBox.value);
        });
    </script>
</body>
</html>
