<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Kids' Fun Wheel</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap');
        
        body {
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FFF9E6;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Container wraps the canvas tightly so the pointer can be positioned relative to it */
        #wheel-container {
            position: relative;
            width: auto;
            height: auto;
            /* Filter dropshadow applies to the whole wheel + pointer combo */
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
        }
        
        /* Pointer positioned absolutely relative to the #wheel-container */
        #pointer {
            position: absolute;
            top: -25px; /* Pull it up so the tip overlaps the wheel slightly */
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 25px solid transparent; /* Wider triangle */
            border-right: 25px solid transparent;
            border-top: 50px solid #FF4500;
            z-index: 10;
        }
        
        canvas {
            display: block;
            touch-action: manipulation;
            border-radius: 50%;
            border: 8px solid #FFD700;
            background-color: white;
            /* Ensure the canvas doesn't get stretched by flexbox */
            flex-shrink: 0; 
        }
    </style>
</head>
<body>

    <div id="wheel-container">
        <div id="pointer"></div>
        <canvas id="canvas"></canvas>
    </div>

    <script>
       const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colors = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'];

        const allTasks = JSON.parse(localStorage.getItem('chore-tasks')) || [];
        const finishedTaskIds = JSON.parse(localStorage.getItem('chore-finished') || '[]');

        const validTasks = allTasks.filter(t => {
            if (!t.name || t.name.trim() === '') return false;
            if (finishedTaskIds.includes(t.id)) return false;
            if (t.dependency) {
                const dependencyId = Number(t.dependency);
                if (!finishedTaskIds.includes(dependencyId)) return false;
            }
            return true;
        });

        const labels = validTasks.length > 0 ? validTasks.map(t => t.emoji || t.name) : ['Add tasks'];
        const sliceCount = labels.length || 1;

        let startAngle = 0;
        const arc = Math.PI / (sliceCount / 2);
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;

        let logicalSize = 500;
        let centerX, centerY, radius;

        function resizeCanvas() {
            // 1. Determine available width (window or screen)
            const availableWidth = window.innerWidth;
            
            // 2. Set the "Logical" size (CSS pixels)
            // We cap it at 500px, or 90% of the screen width
            logicalSize = Math.min(availableWidth * 0.9, 500);
            
            // 3. Get Device Pixel Ratio
            // Force at least 2.0 (High DPI) even if the browser reports 1, 
            // which acts as supersampling to kill blur on all devices.
            const dpr = Math.max(window.devicePixelRatio || 2, 2);

            // 4. Set CSS Dimensions (Layout size)
            canvas.style.width = `${logicalSize}px`;
            canvas.style.height = `${logicalSize}px`;

            // 5. Set Actual Bitmap Dimensions (Multiplied by DPR)
            // Setting canvas.width/height automatically clears the context
            canvas.width = logicalSize * dpr;
            canvas.height = logicalSize * dpr;
            
            // 6. Normalize the Coordinate System
            // We scale the context so we can draw using "logical" coordinates (0-500)
            // but the browser draws them onto the high-res bitmap.
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform just in case
            ctx.scale(dpr, dpr);
            
            // 7. Recalculate drawing variables based on LOGICAL size
            centerX = logicalSize / 2;
            centerY = logicalSize / 2;
            
            // Subtract border/padding from radius
            radius = Math.max((logicalSize / 2) - 10, 10); 
            
            // 8. Improve text rendering
            ctx.textBaseline = 'middle';
            ctx.textAlign = "center";
            
            drawWheel();
        }

        function drawWheel() {
            // Clear the logical rectangle
            ctx.clearRect(0, 0, logicalSize, logicalSize);
            
            for (let i = 0; i < labels.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, angle, angle + arc, false);
                ctx.lineTo(centerX, centerY);
                ctx.fill();

                ctx.save();
                ctx.fillStyle = "white";
                
                // Move context to the center of the wedge
                const textAngle = angle + arc / 2;
                ctx.translate(
                    centerX + Math.cos(textAngle) * (radius * 0.7), 
                    centerY + Math.sin(textAngle) * (radius * 0.7)
                );
                ctx.rotate(textAngle + Math.PI / 2);
                
                // Dynamic Font Sizing
                // Base font size on the wheel size
                let fontSize = Math.floor(logicalSize / 10);
                
                // If text is long, shrink it to fit
                if (labels[i].length > 2) {
                    fontSize = Math.floor(logicalSize / 18);
                    ctx.font = `bold ${fontSize}px Fredoka, sans-serif`;
                    const textWidth = ctx.measureText(labels[i]).width;
                    // Ensure text doesn't overflow wedge width
                    const maxWedgeWidth = radius * 0.5; 
                    if (textWidth > maxWedgeWidth) {
                         fontSize = Math.floor(fontSize * (maxWedgeWidth / textWidth));
                    }
                }
                
                ctx.font = `bold ${fontSize}px Fredoka, sans-serif`;
                
                // Add a slight shadow to text for better readability on colors
                ctx.shadowColor = "rgba(0,0,0,0.2)";
                ctx.shadowBlur = 4;
                ctx.shadowOffsetY = 1;
                
                ctx.fillText(labels[i], 0, 0);
                ctx.restore();
            }
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                clearTimeout(spinTimeout);
                finalizeSpin();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function spinWheel() {
            if (!validTasks.length) {
                alert('Please add at least one task before spinning the wheel.');
                return;
            }
            spinAngleStart = Math.random() * 30 + 60;
            spinTime = 0;
            spinTimeTotal = Math.random() * 1500 + 3000;
            rotateWheel();
        }

        function finalizeSpin() {
            if (!validTasks.length) return;

            const degrees = (startAngle * 180 / Math.PI) + 90;
            const arcd = arc * 180 / Math.PI;
            const index = Math.floor((360 - (degrees % 360)) / arcd) % validTasks.length;
            const selectedTask = validTasks[index];

            const totalSeconds = Number.parseInt(selectedTask.time, 10) > 0
                ? Number.parseInt(selectedTask.time, 10) * 60
                : 0;

            const latest = {
                task: {
                    id: selectedTask.id || null,
                    emoji: selectedTask.emoji || '',
                    name: selectedTask.name || '',
                    time: selectedTask.time || '',
                    dependency: selectedTask.dependency || ''
                },
                totalSeconds,
                remainingSeconds: totalSeconds,
                selectedAt: Date.now(),
                status: 'pending'
            };

            localStorage.setItem('chore-latest', JSON.stringify(latest));

            setTimeout(() => {
                // Navigate to winning page
                try {
                    if (window.parent && typeof window.parent.loadPage === 'function') {
                        window.parent.loadPage('winning-task.html');
                        return;
                    }
                } catch (err) {}
                window.location.href = 'winning-task.html';
            }, 1000);
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        // Listen for resize to keep canvas sharp
        window.addEventListener('resize', () => {
             // Debounce slightly to prevent thrashing
             clearTimeout(window.resizeTimer);
             window.resizeTimer = setTimeout(resizeCanvas, 100);
        });
        
        canvas.addEventListener('click', spinWheel);

        // Initial setup
        resizeCanvas();
    </script>
</body>
</html>
