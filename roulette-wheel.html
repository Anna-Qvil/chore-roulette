<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Kids' Fun Wheel</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap');
        
        body {
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FFF9E6;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* The container now shrinks to fit the canvas exactly */
        #wheel-container {
            position: relative;
            width: auto;
            height: auto;
            /* No padding needed, we position pointer absolutely */
        }
        
        /* Force pointer to stay relative to the wheel, not the page */
        #pointer {
            position: absolute;
            top: -25px; /* Shifts it up slightly so the point touches the wheel */
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #FF4500; /* Red triangle pointing down */
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2)); /* Adds shadow to the triangle */
        }
        
        canvas {
            display: block;
            touch-action: manipulation;
            /* Optional: Add a border/shadow to the wheel itself */
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border: 8px solid #FFD700;
            box-sizing: border-box; /* Includes border in width calculation */
        }
    </style>
</head>
<body>

    <div id="wheel-container">
        <div id="pointer"></div>
        <canvas id="canvas"></canvas>
    </div>

    <script>
       const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colors = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'];

        const allTasks = JSON.parse(localStorage.getItem('chore-tasks')) || [];
        const finishedTaskIds = JSON.parse(localStorage.getItem('chore-finished') || '[]');

        const validTasks = allTasks.filter(t => {
            if (!t.name || t.name.trim() === '') return false;
            if (finishedTaskIds.includes(t.id)) return false;
            if (t.dependency) {
                const dependencyId = Number(t.dependency);
                if (!finishedTaskIds.includes(dependencyId)) return false;
            }
            return true;
        });

        const labels = validTasks.length > 0 ? validTasks.map(t => t.emoji || t.name) : ['Add tasks'];
        const sliceCount = labels.length || 1;

        let startAngle = 0;
        const arc = Math.PI / (sliceCount / 2);
        let spinTimeout = null;
        let spinAngleStart = 0;
        let spinTime = 0;
        let spinTimeTotal = 0;

        let centerX, centerY, radius;
        let logicalSize = 500; 

        function resizeCanvas() {
            // 1. Available width
            const availableWidth = window.innerWidth > 0 ? window.innerWidth : screen.width;
            
            // 2. Logical size (90% width, max 500px)
            logicalSize = Math.min(availableWidth * 0.9, 500);
            
            // 3. Retina/High DPI support
            const dpr = window.devicePixelRatio || 1;

            // 4. Set CSS size
            canvas.style.width = `${logicalSize}px`;
            canvas.style.height = `${logicalSize}px`;

            // 5. Set Bitmap size
            canvas.width = logicalSize * dpr;
            canvas.height = logicalSize * dpr;
            
            // 6. Scale context
            ctx.scale(dpr, dpr);
            
            // 7. Calculate centers
            centerX = logicalSize / 2;
            centerY = logicalSize / 2;
            
            // 8. Radius (subtract border width so text doesn't hit edge)
            radius = Math.max((logicalSize / 2) - 15, 10); 
            
            drawWheel();
        }

        function drawWheel() {
            ctx.clearRect(0, 0, logicalSize, logicalSize);
            
            for (let i = 0; i < labels.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, angle, angle + arc, false);
                ctx.lineTo(centerX, centerY);
                ctx.fill();

                ctx.save();
                ctx.fillStyle = "white";
                ctx.translate(centerX + Math.cos(angle + arc / 2) * (radius * 0.7), centerY + Math.sin(angle + arc / 2) * (radius * 0.7));
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                
                let fontSize = Math.floor(logicalSize / 10);
                if (labels[i].length > 2) {
                    fontSize = Math.floor(logicalSize / 22);
                    ctx.font = `bold ${fontSize}px Fredoka, 'Comic Sans MS', cursive`;
                    const textWidth = ctx.measureText(labels[i]).width;
                    if (textWidth > (radius * 0.4)) {
                        fontSize = Math.floor(fontSize * ((radius * 0.4) / textWidth));
                    }
                }
                ctx.font = `bold ${fontSize}px Fredoka, 'Comic Sans MS', cursive`;
                ctx.textAlign = "center";
                ctx.fillText(labels[i], 0, 0);
                ctx.restore();
            }
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) {
                clearTimeout(spinTimeout);
                finalizeSpin();
                return;
            }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function spinWheel() {
            if (!validTasks.length) {
                alert('Please add at least one task before spinning the wheel.');
                return;
            }
            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000;
            rotateWheel();
        }

        function finalizeSpin() {
            if (!validTasks.length) return;

            const degrees = (startAngle * 180 / Math.PI) + 90;
            const arcd = arc * 180 / Math.PI;
            const index = Math.floor((360 - (degrees % 360)) / arcd) % validTasks.length;
            const selectedTask = validTasks[index];

            const totalSeconds = Number.parseInt(selectedTask.time, 10) > 0
                ? Number.parseInt(selectedTask.time, 10) * 60
                : 0;

            const latest = {
                task: {
                    id: selectedTask.id || null,
                    emoji: selectedTask.emoji || '',
                    name: selectedTask.name || '',
                    time: selectedTask.time || '',
                    dependency: selectedTask.dependency || ''
                },
                totalSeconds,
                remainingSeconds: totalSeconds,
                selectedAt: Date.now(),
                status: 'pending'
            };

            localStorage.setItem('chore-latest', JSON.stringify(latest));

            setTimeout(() => {
                try {
                    if (window.parent && typeof window.parent.loadPage === 'function') {
                        window.parent.loadPage('winning-task.html');
                        return;
                    }
                } catch (err) {}
                window.location.href = 'winning-task.html';
            }, 1000);
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t;
            const tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        window.addEventListener('resize', resizeCanvas);
        canvas.addEventListener('click', spinWheel);

        resizeCanvas();
    </script>
</body>
</html>
