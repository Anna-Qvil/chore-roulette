<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Current Task</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        /* --- Global & Layout --- */
        body {
            margin: 0;
            padding: 0;
            height: 100dvh; /* dynamic height for iOS address bars */
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FFF9E6;
            font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Prevent background scroll */
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Main Card --- */
        #current-task-card {
            background: white;
            width: 90%;
            max-width: 600px; /* Cap width for iPad */
            /* Vertical padding adjusted for balance */
            padding: 40px 20px; 
            border-radius: 30px;
            border: 8px solid #FFD700;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            text-align: center;
            box-sizing: border-box;
            
            /* Ensure card fits on small screens vertically */
            max-height: 90dvh;
            overflow-y: auto; 
        }

        /* --- Typography --- */
        .task-name {
            /* clamp(min, preferred, max) scales text smoothly between iPhone and iPad */
            font-size: clamp(2rem, 6vw, 3.5rem); 
            font-weight: 700;
            color: #FF6B6B;
            margin: 0;
            line-height: 1.2;
            display: flex;
            flex-direction: column; /* Stack emoji and text on small screens if needed */
            align-items: center;
            justify-content: center;
            gap: 10px;
            word-break: break-word;
            padding: 0 10px;
        }

        .timer-display {
            /* Huge font, but responsive */
            font-size: clamp(4.5rem, 18vw, 7rem);
            font-weight: 700;
            color: #1F2937;
            margin: 0;
            letter-spacing: 2px;
            line-height: 1;
            
            /* CRITICAL: Prevents timer from jiggling as numbers change width */
            font-feature-settings: "tnum";
            font-variant-numeric: tabular-nums;
        }

        /* --- Progress Bar --- */
        .progress-shell {
            position: relative;
            width: 100%;
            max-width: 400px; /* Don't get too wide on iPad */
            height: 24px;
            background: #FFEFB0;
            border-radius: 999px;
            overflow: hidden;
            border: 3px solid #FFD700;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%; /* JS updates this */
            background: linear-gradient(90deg, #22C55E, #16A34A);
            transition: width 0.25s linear; /* Linear looks smoother for timers */
        }

        /* --- Control Buttons --- */
        .controls {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 10px;
            width: 100%;
        }

        .controls button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            border: none;
            outline: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .controls button:active {
            transform: scale(0.92);
        }

        .controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .controls button svg {
            width: 36px;
            height: 36px;
            display: block;
        }

        #start-pause-btn {
            background: #22C55E;
            box-shadow: none;
        }
        #start-pause-btn:active {
            transform: translateY(4px);
        }

        #skip-btn {
            background: white;
            border: 3px solid #FF6B6B;
            box-shadow: none;
        }
        #skip-btn:active {
            transform: translateY(4px);
        }

        /* --- Modal Overlay --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px); /* iOS nice blur effect */
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            border: 6px solid #FFD700;
            padding: 30px 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            color: #FF6B6B;
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            line-height: 1.2;
        }

        .modal-content p {
            font-size: 1.1rem;
            color: #4B5563;
            margin: 0 0 25px 0;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column; /* Stack vertically on mobile for easier tapping */
            gap: 12px;
        }

        .modal-buttons button {
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }

        .btn-keep {
            background: #22C55E;
            color: white;
        }

        .btn-remove {
            background: transparent;
            color: #FF6B6B;
            border: 2px solid #FF6B6B !important;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- iPad / Desktop Tweaks --- */
        @media (min-width: 768px) {
            .modal-buttons {
                flex-direction: row; /* Side by side on larger screens */
            }
            .task-name {
                flex-direction: row; /* Emoji next to text on iPad */
            }
        }
    </style>
</head>
<body>

    <div id="current-task-card">
        <p id="task-name" class="task-name">🎯 Ready</p>
        
        <div class="progress-shell" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        
        <p id="timer" class="timer-display">00:00</p>
        
        <div class="controls">
            <button id="start-pause-btn" aria-label="Start">
                <svg viewBox="0 0 24 24" fill="white">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            <button id="skip-btn" aria-label="Skip">
                <svg viewBox="0 0 24 24" fill="#FF6B6B">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="skip-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Done already?</h2>
            <p>Did you finish the task, or do you want to save it for later?</p>
            <div class="modal-buttons">
                <button class="btn-keep" id="keep-btn">Keep for later</button>
                <button class="btn-remove" id="remove-btn">Mark complete & remove</button>
            </div>
        </div>
    </div>

    <script>
        const taskNameEl = document.getElementById('task-name');
        const progressEl = document.getElementById('progress-bar');
        const timerEl = document.getElementById('timer');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const skipBtn = document.getElementById('skip-btn');
        const skipModal = document.getElementById('skip-modal');
        const keepBtn = document.getElementById('keep-btn');
        const removeBtn = document.getElementById('remove-btn');

        let latest = null;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timerId = null;
        let wakeLock = null;

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const secs = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function syncButtons(status) {
            const isRunning = status === 'running';
            // Play Icon vs Pause Icon
            startPauseBtn.innerHTML = isRunning
                ? '<svg viewBox="0 0 24 24" fill="white"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
            
            startPauseBtn.setAttribute('aria-label', isRunning ? 'Pause' : 'Start');
            
            const disabled = !latest || status === 'done' || status === 'skipped';
            startPauseBtn.disabled = disabled;
            skipBtn.disabled = disabled;
        }

        function updateProgress() {
            if (!totalSeconds || totalSeconds <= 0) {
                progressEl.style.width = '0%';
                return;
            }
            const ratio = Math.max(0, remainingSeconds) / totalSeconds;
            progressEl.style.width = `${Math.min(100, ratio * 100)}%`;
        }

        function renderLatest(statusOverride) {
            if (!latest || !latest.task || !latest.task.name) {
                taskNameEl.innerHTML = '<span>🎯</span> <span>Ready</span>';
                timerEl.textContent = '00:00';
                syncButtons('idle');
                return;
            }

            const status = statusOverride || latest.status || 'pending';
            const emoji = latest.task.emoji || '🎯';

            // Use span tags to control layout if needed
            taskNameEl.innerHTML = `<span>${emoji}</span> <span>${latest.task.name}</span>`;
            timerEl.textContent = formatTime(remainingSeconds);
            updateProgress();

            syncButtons(status);
        }

        function persist(status) {
            if (!latest) return;
            latest.status = status;
            latest.remainingSeconds = remainingSeconds;
            localStorage.setItem('chore-latest', JSON.stringify(latest));
        }

        function stopTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            releaseWakeLock();
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        console.log('Wake Lock released');
                    });
                }
            } catch (err) {
                console.error('Wake Lock error:', err);
            }
        }

        function releaseWakeLock() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
        }

        function markTaskAsFinished() {
            if (!latest || !latest.task) return;
            const finishedTasks = JSON.parse(localStorage.getItem('chore-finished') || '[]');
            const taskId = latest.task.id;
            if (taskId && !finishedTasks.includes(taskId)) {
                finishedTasks.push(taskId);
                localStorage.setItem('chore-finished', JSON.stringify(finishedTasks));
            }
        }

        function finish(status) {
            stopTimer();
            remainingSeconds = Math.max(remainingSeconds, 0);
            persist(status);
            renderLatest(status);
            if (status === 'done') {
                playChime();
                markTaskAsFinished();
                setTimeout(goToWheel, 1400);
            }
        }

        function tick() {
            remainingSeconds = Math.max(0, remainingSeconds - 1);
            timerEl.textContent = formatTime(remainingSeconds);
            updateProgress();
            persist('running');
            if (remainingSeconds <= 0) {
                finish('done');
            }
        }

        function startTimer() {
            if (!latest) return;
            if (remainingSeconds <= 0) {
                remainingSeconds = totalSeconds;
            }
            if (remainingSeconds <= 0) {
                finish('done');
                return;
            }
            stopTimer();
            persist('running');
            renderLatest('running');
            timerId = setInterval(tick, 1000);
            requestWakeLock();
        }

        function pauseTimer() {
            stopTimer();
            persist('paused');
            renderLatest('paused');
        }

        function skipTask() {
            stopTimer();
            skipModal.classList.add('active');
        }

        function handleKeepTask() {
            skipModal.classList.remove('active');
            remainingSeconds = Number.parseInt(latest?.task?.time, 10) > 0
                ? Number.parseInt(latest.task.time, 10) * 60
                : 0;
            persist('skipped');
            goToWheel();
        }

        function handleRemoveTask() {
            skipModal.classList.remove('active');
            markTaskAsFinished();
            remainingSeconds = Number.parseInt(latest?.task?.time, 10) > 0
                ? Number.parseInt(latest.task.time, 10) * 60
                : 0;
            persist('skipped');
            goToWheel();
        }

        function toggleStartPause() {
            const status = latest?.status;
            if (status === 'running') {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function loadLatest(reRenderOnly) {
            const stored = localStorage.getItem('chore-latest');
            latest = stored ? JSON.parse(stored) : null;
            totalSeconds = Number.parseInt(latest?.totalSeconds, 10) > 0
                ? Number.parseInt(latest.totalSeconds, 10)
                : Number.parseInt(latest?.task?.time, 10) > 0
                    ? Number.parseInt(latest.task.time, 10) * 60
                    : 0;
            remainingSeconds = Number.isFinite(latest?.remainingSeconds)
                ? Math.max(0, Number(latest.remainingSeconds))
                : totalSeconds;
            if (!reRenderOnly) {
                stopTimer();
            }
            renderLatest(latest?.status || 'pending');
        }

        startPauseBtn.addEventListener('click', toggleStartPause);
        skipBtn.addEventListener('click', skipTask);
        keepBtn.addEventListener('click', handleKeepTask);
        removeBtn.addEventListener('click', handleRemoveTask);

        skipModal.addEventListener('click', (event) => {
            if (event.target === skipModal) {
                skipModal.classList.remove('active');
            }
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'chore-latest') {
                loadLatest();
            }
        });

        // Handle page visibility changes to manage wake lock
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && latest?.status === 'running') {
                await requestWakeLock();
            }
        });

        loadLatest();

        function goToWheel() {
            try {
                if (window.parent && typeof window.parent.loadPage === 'function') {
                    window.parent.loadPage('roulette-wheel.html');
                    return;
                }
            } catch (e) {
                // Fall through
            }
            window.location.href = 'roulette-wheel.html';
        }

        function playChime() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);
            osc.connect(gain).connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 1);
        }
    </script>
</body>
</html>
