<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Task</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Card layout for the current task view */
        #current-task-card {
            background: white;
            width: 90%;
            max-width: 640px;
            padding: 40px 30px;
            border-radius: 24px;
            border: 10px solid #FFD700;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            gap: 24px;
            text-align: center;
        }

        /* Modal overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            border: 10px solid #FFD700;
            padding: 40px 30px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            color: #FF6B6B;
            font-size: 2rem;
            margin: 0 0 20px 0;
        }

        .modal-content p {
            font-size: 1.2rem;
            color: #1F2937;
            margin: 0 0 30px 0;
        }

        .modal-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .modal-buttons button {
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-buttons button:active {
            transform: scale(0.95);
        }

        .btn-keep {
            background: #22C55E;
            color: white;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .btn-keep:hover {
            background: #16A34A;
        }

        .btn-remove {
            background: #FF6B6B;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .btn-remove:hover {
            background: #EF4444;
        }

        .task-name {
            font-size: 3rem;
            font-weight: bold;
            color: #FF6B6B;
            margin: 0;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            word-break: break-word;
        }

        .progress-shell {
            position: relative;
            width: 100%;
            height: 20px;
            background: #FFEFB0;
            border-radius: 999px;
            overflow: hidden;
            border: 3px solid #FFD700;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #22C55E, #16A34A);
            transition: width 0.25s ease;
        }

        .timer-display {
            font-size: 5.5rem;
            font-weight: bold;
            color: #1F2937;
            margin: 0;
            letter-spacing: 3px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        .controls button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .controls button svg {
            width: 40px;
            height: 40px;
        }

        .controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .controls button:active:not(:disabled) {
            transform: scale(0.95);
        }

        #start-pause-btn {
            background: #22C55E;
            border: none;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        #skip-btn {
            background: white;
            border: 3px solid #FF6B6B;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="current-task-card">
        <p id="task-name" class="task-name">🎯</p>
        <div class="progress-shell" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="timer" class="timer-display">00:00</p>
        <div class="controls">
            <button id="start-pause-btn" aria-label="Start">
                <svg viewBox="0 0 24 24" fill="white">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </button>
            <button id="skip-btn" aria-label="Skip">
                <svg viewBox="0 0 24 24" fill="#FF6B6B">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="skip-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Are you done with this task?</h2>
            <p>Please confirm if you have completed this task or want to keep it for later.</p>
            <div class="modal-buttons">
                <button class="btn-keep" id="keep-btn">Keep</button>
                <button class="btn-remove" id="remove-btn">Remove</button>
            </div>
        </div>
    </div>

    <script>
        const taskNameEl = document.getElementById('task-name');
        const progressEl = document.getElementById('progress-bar');
        const timerEl = document.getElementById('timer');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const skipBtn = document.getElementById('skip-btn');
        const skipModal = document.getElementById('skip-modal');
        const keepBtn = document.getElementById('keep-btn');
        const removeBtn = document.getElementById('remove-btn');

        let latest = null;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let timerId = null;

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const secs = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function syncButtons(status) {
            const isRunning = status === 'running';
            startPauseBtn.innerHTML = isRunning
                ? '<svg viewBox="0 0 24 24" fill="white"><path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/></svg>'
                : '<svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
            startPauseBtn.setAttribute('aria-label', isRunning ? 'Pause' : 'Start');
            const disabled = !latest || status === 'done' || status === 'skipped';
            startPauseBtn.disabled = disabled;
            skipBtn.disabled = disabled;
        }

        function updateProgress() {
            if (!totalSeconds || totalSeconds <= 0) {
                progressEl.style.width = '0%';
                return;
            }
            const ratio = Math.max(0, remainingSeconds) / totalSeconds;
            progressEl.style.width = `${Math.min(100, ratio * 100)}%`;
        }

        function renderLatest(statusOverride) {
            if (!latest || !latest.task || !latest.task.name) {
                taskNameEl.textContent = '🎯';
                timerEl.textContent = '00:00';
                syncButtons('idle');
                return;
            }

            const status = statusOverride || latest.status || 'pending';
            const emoji = latest.task.emoji || '🎯';

            taskNameEl.textContent = `${emoji} ${latest.task.name}`;
            timerEl.textContent = formatTime(remainingSeconds);
            updateProgress();

            syncButtons(status);
        }

        function persist(status) {
            if (!latest) return;
            latest.status = status;
            latest.remainingSeconds = remainingSeconds;
            localStorage.setItem('chore-latest', JSON.stringify(latest));
        }

        function stopTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
        }

        function markTaskAsFinished() {
            if (!latest || !latest.task) return;
            const finishedTasks = JSON.parse(localStorage.getItem('chore-finished') || '[]');
            const taskId = latest.task.id;
            if (taskId && !finishedTasks.includes(taskId)) {
                finishedTasks.push(taskId);
                localStorage.setItem('chore-finished', JSON.stringify(finishedTasks));
            }
        }

        function finish(status) {
            stopTimer();
            remainingSeconds = Math.max(remainingSeconds, 0);
            persist(status);
            renderLatest(status);
            if (status === 'done') {
                playChime();
                // Mark task as finished when timer completes
                markTaskAsFinished();
                setTimeout(goToWheel, 1400);
            }
        }

        function tick() {
            remainingSeconds = Math.max(0, remainingSeconds - 1);
            timerEl.textContent = formatTime(remainingSeconds);
            updateProgress();
            persist('running');
            if (remainingSeconds <= 0) {
                finish('done');
            }
        }

        function startTimer() {
            if (!latest) return;
            if (remainingSeconds <= 0) {
                remainingSeconds = totalSeconds;
            }
            if (remainingSeconds <= 0) {
                finish('done');
                return;
            }
            stopTimer();
            persist('running');
            renderLatest('running');
            timerId = setInterval(tick, 1000);
        }

        function pauseTimer() {
            stopTimer();
            persist('paused');
            renderLatest('paused');
        }

        function skipTask() {
            stopTimer();
            // Show modal to ask if user wants to keep or remove
            skipModal.classList.add('active');
        }

        function handleKeepTask() {
            skipModal.classList.remove('active');
            remainingSeconds = Number.parseInt(latest?.task?.time, 10) > 0
                ? Number.parseInt(latest.task.time, 10) * 60
                : 0;
            persist('skipped');
            goToWheel();
        }

        function handleRemoveTask() {
            skipModal.classList.remove('active');
            markTaskAsFinished();
            remainingSeconds = Number.parseInt(latest?.task?.time, 10) > 0
                ? Number.parseInt(latest.task.time, 10) * 60
                : 0;
            persist('skipped');
            goToWheel();
        }

        function toggleStartPause() {
            const status = latest?.status;
            if (status === 'running') {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function loadLatest(reRenderOnly) {
            const stored = localStorage.getItem('chore-latest');
            latest = stored ? JSON.parse(stored) : null;
            totalSeconds = Number.parseInt(latest?.totalSeconds, 10) > 0
                ? Number.parseInt(latest.totalSeconds, 10)
                : Number.parseInt(latest?.task?.time, 10) > 0
                    ? Number.parseInt(latest.task.time, 10) * 60
                    : 0;
            remainingSeconds = Number.isFinite(latest?.remainingSeconds)
                ? Math.max(0, Number(latest.remainingSeconds))
                : totalSeconds;
            if (!reRenderOnly) {
                stopTimer();
            }
            renderLatest(latest?.status || 'pending');
        }

        startPauseBtn.addEventListener('click', toggleStartPause);
        skipBtn.addEventListener('click', skipTask);
        keepBtn.addEventListener('click', handleKeepTask);
        removeBtn.addEventListener('click', handleRemoveTask);

        // Close modal when clicking outside of it
        skipModal.addEventListener('click', (event) => {
            if (event.target === skipModal) {
                skipModal.classList.remove('active');
            }
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'chore-latest') {
                loadLatest();
            }
        });

        loadLatest();

        function goToWheel() {
            try {
                if (window.parent && typeof window.parent.loadPage === 'function') {
                    window.parent.loadPage('roulette-wheel.html');
                    return;
                }
            } catch (e) {
                // Fall through to direct navigation
            }
            window.location.href = 'roulette-wheel.html';
        }

        function playChime() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);
            osc.connect(gain).connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 1);
        }
    </script>
</body>
</html>
